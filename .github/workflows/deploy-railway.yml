name: Deploy HarborOps To Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate server entrypoint
        run: node --check server.js

      - name: Validate frontend script
        run: node --check pitch_demo/app.js

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "3f5aa530-8ebe-45fa-add0-c1aed44091f2" --environment "8d2c8323-a718-469d-8e3c-8c965ece6c8c" --project "3d7873bd-e749-4e63-a8eb-75f85f077f52" --ci
